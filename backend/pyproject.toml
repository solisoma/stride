[project]
name = "stride"
version = "0.1.0"
description = "Guided learning for exams, technical interviews, and new fields"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pika>=1.3,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
    "langsmith>=0.4,<1",
    "openai>=2.32,<3",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.27,<1",
    "pypdf[image]>=6.10,<7",
    "python-docx>=1.2,<2",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
local-whisper = ["openai-whisper>=20250625"]
media = ["moviepy>=2.2,<3", "pydub>=0.25,<1"]
postgres = ["psycopg2-binary>=2.9,<3"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pyright>=1.1.414",
    "ruff>=0.17.0",
]

[tool.uv]
package = false
